# Keeps link previews (previews/<id>.jpg and the share pages a/<id>/) in step with the gallery. Publishing from
# Peel Studio and deleting from the site only push the zip and manifest.json; this renders previews for new or
# changed artworks, removes those of deleted ones, and commits the result to docs/ (and public/), which Pages
# serves. Pushes made with GITHUB_TOKEN do not start workflows, so this commit does not retrigger itself.
name: Link previews

on:
  push:
    branches: [main]
    paths:
      - "public/sequences/**"
      - "docs/sequences/**"
      - "scripts/buildPreviews.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/buildPreviews.mjs

      - name: Commit and push
        run: |
          git add -A public/previews public/a docs/previews docs/a
          if git diff --cached --quiet; then
            echo "Previews already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update link previews"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
